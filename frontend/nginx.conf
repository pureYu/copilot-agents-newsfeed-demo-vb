server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/* to the backend service, stripping the /api prefix.
    # This mirrors the Vite dev-server proxy in vite.config.ts so the
    # same frontend build works both locally (via Vite) and in Docker (via nginx).
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA fallback: serve index.html for any unmatched path so that
    # React Router client-side routes work on full-page refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
