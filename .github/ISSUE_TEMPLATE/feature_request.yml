name: Feature Request
description: Request a new feature or user-facing capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for new features or user-visible functionality.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should be added and why?
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements reference
      description: Which section of docs/REQUIREMENTS_SUMMARY.md does this address?
    validations:
      required: false
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Observable conditions that must be true for this to be considered done.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes and dependencies
      description: Anything the implementer should know. Dependencies on other issues.
    validations:
      required: false
