name: Chore / Technical Task
description: Infrastructure, tooling, configuration, documentation, or refactoring work
title: "[Chore]: "
labels: ["chore"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for non-feature work such as setup tasks, documentation, refactoring, or CI/tooling changes.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done and why?
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: How will we know this chore is complete?
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - documentation
        - configuration
        - infrastructure
        - refactoring
        - dependency update
        - evidence / demo
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything else relevant.
    validations:
      required: false
